<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>Inspector — preview</title></head>
<body>
<div style="display:flex;height:410px;justify-content:flex-start"><aside class="wm-insp">
  <div class="wm-insp__head"><span class="wm-insp__title">กล้องหลัก</span><span class="wm-chip wm-chip--live"><span class="wm-dot"></span>PGM</span></div>
  <div class="wm-tabs" role="tablist" data-toggle="aria-selected"><button role="tab" aria-selected="true">ภาพ</button><button role="tab" aria-selected="false">เสียง</button><button role="tab" aria-selected="false">สี</button><button role="tab" aria-selected="false">AI</button></div>
  <div class="wm-insp__body">
    <div class="wm-field"><span>ขนาด</span><div class="wm-range"><div class="wm-range__track"><div class="wm-range__fill" style="width:100%"></div><div class="wm-range__knob" style="left:100%"></div></div><span class="wm-range__val">100%</span></div></div>
    <div class="wm-field"><span>ความโปร่งใส</span><div class="wm-range"><div class="wm-range__track"><div class="wm-range__fill" style="width:72%"></div><div class="wm-range__knob" style="left:72%"></div></div><span class="wm-range__val">72%</span></div></div>
    <div class="wm-insp__row"><span>กลับด้านภาพ</span><span class="wm-toggle" role="switch" aria-checked="false"></span></div>
    <div class="wm-insp__row"><span>ลบพื้นหลังด้วย AI</span><span class="wm-toggle is-on" role="switch" aria-checked="true"></span></div>
    <button class="wm-disclose">ตั้งค่าขั้นสูง<svg class="wm-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</aside></div>
<script>
  document.querySelectorAll('[data-toggle]').forEach(function (g) {
    g.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || !g.contains(b)) return;
      var attr = g.getAttribute('data-toggle');
      g.querySelectorAll('button').forEach(function (x) { x.setAttribute(attr, x === b ? 'true' : 'false'); });
    });
  });
</script>
</body>
</html>
